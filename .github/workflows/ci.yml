name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python scripts/validate_contracts.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --verbose

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No backend yet, skipping."; fi
      - if: steps.exists.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.exists.outputs.present == 'true'
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f android/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Android project yet, skipping."; fi
      - if: steps.exists.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.exists.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.exists.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug check --no-daemon
